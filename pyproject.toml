[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postureflow-frontend"
version = "0.1.0"
description = "PostureFlow desktop posture-monitoring frontend"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
postureflow = "postureflow.app:main"

[tool.setuptools]
packages = ["postureflow", "postureflow.backend"]
package-dir = {postureflow = "."}

[tool.setuptools.package-data]
postureflow = ["qml/*.qml", "qml/components/*.qml", "qml/pages/*.qml", "qml/settings/*.qml", "qml/theme/*", "assets/*", "docs/*.md"]
